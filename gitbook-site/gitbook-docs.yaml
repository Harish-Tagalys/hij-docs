$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: HIJ Search Docs
  structure:
    - type: section
      key: section-home
      title: Get started
      path: home
      icon: rocket
      description: "Install the app, collect credentials, choose your path and verify the integration."
      default: true
      children:
        - type: space
          key: space-home
          title: Get started
          path: home
          default: true
          content:
            directory: ./get-started
    - type: section
      key: section-storefront-api
      title: Storefront API
      path: storefront-api
      icon: code
      description: "Path A: call the v2 REST API directly, from a server or an app."
      children:
        - type: space
          key: space-storefront-api-v2
          title: Storefront API v2
          path: v2
          default: true
          content:
            directory: ./storefront-api
    - type: section-group
      key: group-js-sdks
      title: JS SDKs
      icon: js
      children:
        - type: section
          key: section-sdks
          title: Overview
          path: sdks
          icon: compass
          description: "Full stack or headless, and the browser-only rule"
          children:
            - type: space
              key: space-sdks
              title: JS SDKs overview
              path: current
              default: true
              content:
                directory: ./sdks
        - type: section
          key: section-full-stack
          title: Full stack
          path: full-stack
          icon: table-cells
          description: "UI widgets SDK, HIJ.UIWidgets.*"
          children:
            - type: space
              key: space-full-stack-3x
              title: "Full stack 3.x · Latest"
              path: v3
              default: true
              content:
                directory: ./full-stack/3.x
            - type: space
              key: space-full-stack-2x
              title: "Full stack 2.x · Legacy"
              path: v2
              content:
                directory: ./full-stack/2.x
        - type: section
          key: section-headless
          title: Headless
          path: headless
          icon: plug
          description: "Connector SDK, HIJ.Connector.*"
          children:
            - type: space
              key: space-headless-3x
              title: "Headless 3.x · Latest"
              path: v3
              default: true
              content:
                directory: ./headless/3.x
            - type: space
              key: space-headless-2x
              title: "Headless 2.x · Legacy"
              path: v2
              content:
                directory: ./headless/2.x
    - type: section-group
      key: group-analytics
      title: Analytics
      icon: chart-line
      children:
        - type: section
          key: section-analytics
          title: Analytics
          path: analytics
          icon: chart-line
          description: "Which events, who sends them, and how"
          children:
            - type: space
              key: space-analytics
              title: Analytics
              path: current
              default: true
              content:
                directory: ./analytics
        - type: section
          key: section-gtm
          title: GTM template
          path: gtm
          icon: tags
          description: Google Tag Manager tag template releases
          children:
            - type: space
              key: space-gtm-r20260217
              title: "GTM r20260217 · Latest"
              path: r20260217
              default: true
              content:
                directory: ./gtm/r20260217
            - type: space
              key: space-gtm-r20250801
              title: "GTM r20250801 · Legacy"
              path: r20250801
              content:
                directory: ./gtm/r20250801
            - type: space
              key: space-gtm-r20240718
              title: "GTM r20240718 · Legacy"
              path: r20240718
              content:
                directory: ./gtm/r20240718
    - type: section
      key: section-ab-testing
      title: "A/B testing"
      path: ab-testing
      icon: flask
      description: "Test collection merchandising on Liquid, Hydrogen/Oxygen and Remix."
      children:
        - type: space
          key: space-ab-testing
          title: "A/B testing"
          path: current
          default: true
          content:
            directory: ./ab-testing
    - type: section
      key: section-checkout-recommendations
      title: Checkout recommendations
      path: checkout-recommendations
      icon: cart-shopping
      description: "Recommendation blocks for checkout, with a style token reference."
      children:
        - type: space
          key: space-checkout-recommendations
          title: Checkout recommendations
          path: current
          default: true
          content:
            directory: ./checkout-recommendations
    - type: section
      key: section-recipes
      title: Recipes
      path: recipes
      icon: book-open
      description: "Colour swatches, similar products, lazy widgets and multi-market stores."
      children:
        - type: space
          key: space-recipes
          title: Recipes
          path: current
          default: true
          content:
            directory: ./recipes
    - type: section
      key: section-changelogs
      title: Changelogs
      path: changelogs
      icon: clock-rotate-left
      description: "Full stack, headless, Storefront API and GTM template releases."
      children:
        - type: space
          key: space-changelogs
          title: Changelogs
          path: current
          default: true
          content:
            directory: ./changelogs
